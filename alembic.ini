# Alembic configuration for Chief Agent.
# The database URL is read from the DATABASE_URL environment variable at runtime
# (see backend/chief_agent/data/migrations/env.py), so no credentials are ever
# stored in this file.
[alembic]
script_location = backend/chief_agent/data/migrations
prepend_sys_path = backend
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
