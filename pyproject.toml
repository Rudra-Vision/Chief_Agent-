[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chief-agent"
version = "0.1.0"
description = "Self-improving algorithmic trading system for the Indian market (Upstox)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chief Agent" }]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
fast = ["polars>=1.0"]

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
chief_agent = ["data/migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
markers = [
    "slow: slower tests",
    "integration: exercises more than one component",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
